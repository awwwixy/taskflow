<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taskflow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Taskflow</h1>
        <button id="ligin-btn">Увійти</button>
    </header>

    <main>
        <section id="stats">

        </section>

        <section id="add-task">
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Піти на тренування">

                <select id="task-priority">
                    <option value="1">Високий пріоритет</option>
                    <option value="2" selected>Середній пріоритет</option>
                    <option value="3">Низький пріоритет</option>
                </select>

                <button type="submit">Додати</button>
            </form>
        </section>

        <section id="tasks">
            <ul id="task-list"></ul>
        </section>

        <section id="import">

        </section>
    </main>

    <script type="module" src="js/main.js"></script>
    
</body>
</html>
